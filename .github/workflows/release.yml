name: release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      tag:
        description: "Tag a publicar (ex.: v0.1.7)"
        required: true

permissions:
  contents: write

jobs:
  build:
    name: ${{ matrix.os }} ${{ matrix.target || '' }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            args: --bundles deb,rpm,appimage
          - os: windows-latest
            args: --bundles msi,nsis
          - os: macos-latest
            args: --bundles app,dmg
          - os: macos-latest
            target: x86_64-apple-darwin
            args: --bundles app,dmg --target x86_64-apple-darwin
    runs-on: ${{ matrix.os }}

    steps:
      - uses: actions/checkout@v4

      - name: Dependências de sistema (Linux)
        if: matrix.os == 'ubuntu-latest'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev \
            libsoup-3.0-dev \
            libgtk-3-dev \
            librsvg2-dev \
            libappindicator3-dev \
            patchelf \
            rpm

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - uses: dtolnay/rust-toolchain@stable

      - name: Alvo extra (macOS Intel)
        if: matrix.target != ''
        run: rustup target add ${{ matrix.target }}

      - uses: swatinem/rust-cache@v2
        with:
          workspaces: src-tauri
          key: ${{ matrix.target || 'native' }}

      - name: Instalar dependências
        run: npm ci

      - name: Build (sem publicar)
        run: npx tauri build ${{ matrix.args }}

      - name: Guardar bundles
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.os }}-${{ matrix.target || 'native' }}
          if-no-files-found: error
          path: |
            src-tauri/target/release/bundle/**/*
            src-tauri/target/*/release/bundle/**/*

  publish:
    name: publish
    needs: build
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Baixar todos os bundles
        uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true

      - name: Listar o que será publicado
        run: find dist -type f | sort

      - name: Criar/atualizar release (rascunho)
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ github.event.inputs.tag || github.ref_name }}
        run: |
          cat > notes.md <<'NOTES'
          Desktop client for the pi coding agent — sessions by project, live
          subagent runs, and a transcript that reads like documentation.

          ## Download

          | System | File |
          |---|---|
          | Debian / Ubuntu | `.deb` |
          | Fedora / RHEL | `.rpm` |
          | Any Linux | `.AppImage` |
          | Windows | `.exe` (NSIS) / `.msi` |
          | macOS Apple Silicon | `aarch64.dmg` |
          | macOS Intel | `x64.dmg` |

          ## Requirements

          - `pi` 1.4+ on `PATH` (the app never installs or updates pi)
          - Node.js 22+ (pi's runtime)
          - Linux: `libwebkit2gtk-4.1`, `libsoup-3.0`, `gtk+-3.0`, `librsvg2`

          ## Notes

          Binaries are **unsigned** — macOS Gatekeeper and Windows SmartScreen
          warn on first launch. Full changelog: CHANGELOG.md in the repo.
          NOTES

          gh release view "$TAG" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1 \
            || gh release create "$TAG" --repo "$GITHUB_REPOSITORY" \
                 --draft --title "pi-deck $TAG" --notes-file notes.md

          find dist -type f -print0 \
            | xargs -0 gh release upload "$TAG" \
                --repo "$GITHUB_REPOSITORY" --clobber
