[package]
name = "pi-deck"
version = "0.1.17"
edition = "2021"
description = "Desktop client for the pi coding agent"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
base64 = "0.21"
serde_json = "1"
# System font enumeration for the settings font pickers (fontconfig on Linux,
# CoreText on macOS, DirectWrite on Windows).
font-kit = { version = "0.14", features = ["source-fontconfig-default"] }

[profile.dev]
opt-level = 0
